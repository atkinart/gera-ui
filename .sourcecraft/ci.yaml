on:
  push:
    - workflows: build-workflow 
      filter: 
        branches: ["master", "main", "feat/**"]

workflows:
  build-workflow:
    tasks:
      - build-task

tasks:
  - name: build-task
    cubes:
      - name: lint-eslint
        image: cr.yandex/mirror/library/node:lts
        script:
          - npm ci
          - npm run lint

      - name: build-npm
        image: cr.yandex/mirror/library/node:lts
        script:
          - npm ci
          - npm run build --if-present
          - npm test
