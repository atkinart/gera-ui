on:
  push:
    - workflows: build-workflow 
      filter: 
        branches: ["master", "main", "feat/**"]

workflows:
  build-workflow:
    tasks:
      - build-task

tasks:
  - name: build-task
    cubes:
      - name: lint-megalinter
        image: oxsecurity/megalinter:v7
        env:
          ENABLE_LINTERS: JAVASCRIPT_ES,MARKDOWN_MARKDOWNLINT,EDITORCONFIG_EDITORCONFIG_CHECK
          VALIDATE_ALL_CODEBASE: "true"
          DEFAULT_BRANCH: main
        script:
          - python3 /app/mega_linter.py

      - name: build-npm
        image: cr.yandex/mirror/library/node:lts
        script:
          - npm ci
          - npm run build --if-present
          - npm test
