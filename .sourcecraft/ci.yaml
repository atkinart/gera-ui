on:
  pull_request:
    - workflows: [pr-ci]
      filter:
        source_branches: ["**"]
        target_branches: ["main", "master"]
  push:
    - workflows: [main-ci]
      filter:
        branches: ["main", "master"]

workflows:
  pr-ci:
    tasks:
      - install
      - lint
      - test

  main-ci:
    tasks:
      - install
      - lint
      - test
      - build
      - docker

tasks:
  - name: install
    cubes:
      - name: node-install
        image: docker.io/library/node:18
        script:
          - node --version
          - npm --version
          - npm ci

  - name: lint
    cubes:
      - name: node-lint
        image: docker.io/library/node:18
        script:
          - npm run lint

  - name: test
    cubes:
      - name: node-test
        image: docker.io/library/node:18
        script:
          - npm test

  - name: build
    cubes:
      - name: node-build
        image: docker.io/library/node:18
        script:
          - npm run build
        artifacts:
          paths:
            - dist/**

  - name: docker
    # Push image to Sourcecraft Container Registry (SCR): pkg.sourcecraft.tech
    env:
      SCR_HOST: pkg.sourcecraft.tech
      ORG_SLUG: ${{ secrets.SCR_ORG_SLUG }}           # your Sourcecraft organization slug
      REGISTRY_ID: ${{ secrets.SCR_REGISTRY_ID }}     # the numeric/slug registry ID
      IMAGE_NAME: ${{ secrets.SCR_IMAGE_NAME }}       # e.g. geo-construction-app
      TAG: ${{ secrets.SCR_TAG }}                     # optional, defaults to ci
      PAT: ${{ secrets.SCR_PAT }}                     # Personal Access Token for docker login
    cubes:
      - name: docker-build-and-push
        script:
          - echo "$PAT" | docker login "$SCR_HOST" -u iam --password-stdin
          - export FULL_IMAGE="$SCR_HOST/cr/$ORG_SLUG/$REGISTRY_ID/$IMAGE_NAME:${TAG:-ci}"
          - docker build -t "$FULL_IMAGE" .
          - docker push "$FULL_IMAGE"
          - docker logout "$SCR_HOST"